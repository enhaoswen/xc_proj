name: Build Windows

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: "6.7.3"
  BUILD_TYPE: Release
  APP_NAME: XingChenProj

jobs:
  build-windows:
    name: Windows executable
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure CMake
        shell: pwsh
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_BUILD_TYPE="$env:BUILD_TYPE"

      - name: Build
        shell: pwsh
        run: cmake --build build --config "$env:BUILD_TYPE" --parallel

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $packageDir = "package\$env:APP_NAME"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          $exe = "build\bin\$env:BUILD_TYPE\$env:APP_NAME.exe"
          Copy-Item $exe $packageDir
          Copy-Item "RES\OFL.txt" "$packageDir\OFL-Lora.txt"
          windeployqt --release --qmldir qml --dir $packageDir "$packageDir\$env:APP_NAME.exe"

      - name: Create zip
        shell: pwsh
        run: |
          Compress-Archive -Path "package\$env:APP_NAME\*" -DestinationPath "$env:APP_NAME-windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XingChenProj-windows-x64
          path: XingChenProj-windows-x64.zip
          if-no-files-found: error
